<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>تسجيل الدخول — لوحة التحكم</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/admin.css?v=2" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  </defs></svg>
  <div class="ambient" aria-hidden="true"></div>
  <div class="auth">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark">ج</div>
        <div class="brand-text"><strong>جاد العبدالله للمحاماة</strong><span>تسجيل الدخول إلى لوحة إدارة الموقع</span></div>
      </div>
      <form class="card" id="authForm">
        <div id="alertBox" class="alert"></div>
        <div class="field">
          <label for="username">اسم المستخدم</label>
          <input type="text" id="username" name="username" dir="ltr" autocomplete="username" autocapitalize="off" spellcheck="false" required />
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <div class="pw-wrap"><input type="password" id="password" name="password" autocomplete="current-password" required />
          <button type="button" class="icon-btn" data-toggle-pw="password" aria-label="إظهار كلمة المرور"><svg class="i"><use href="#i-eye"/></svg></button></div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">دخول</button>
      </form>
      <div class="credit">تم التطوير بواسطة <a href="https://solimanx.com" target="_blank" rel="noopener">solimanx.com</a></div>
    </div>
  </div>
  <script>
    document.querySelectorAll("[data-toggle-pw]").forEach((b) => b.addEventListener("click", () => {
      const i = document.getElementById(b.dataset.togglePw);
      i.type = i.type === "password" ? "text" : "password";
    }));
    const form = document.getElementById("authForm");
    const alertBox = document.getElementById("alertBox");
    const btn = document.getElementById("submitBtn");
    const label = btn.textContent;
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.remove("show");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span><span>جارٍ الدخول…</span>';
      try {
        const body = {};
        form.querySelectorAll("input[name]").forEach((i) => (body[i.name] = i.name === "username" ? i.value.trim() : i.value));
        const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const result = await res.json();
        if (!result.ok) throw new Error(result.error || "حدث خطأ غير متوقع.");
        document.querySelector(".auth-card").style.cssText = "transition:.4s;opacity:0;transform:scale(.98)";
        setTimeout(() => (window.location.href = "/admin/dashboard.html"), 250);
      } catch (err) {
        alertBox.textContent = err.message === "Failed to fetch" ? "تعذر الاتصال. تأكدي أن نافذة التشغيل مفتوحة." : err.message;
        void alertBox.offsetWidth;
        alertBox.classList.add("show");
        btn.disabled = false;
        btn.textContent = label;
      }
    });
    form.querySelector("input").focus();
  </script>
</body>
</html>
